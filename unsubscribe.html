<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Unsubscribe — Cohost</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#050505; --bg-1:#0a0a0a; --fg:#fafafa; --fg-muted:#a1a1a1; --fg-faint:#6f6f6f;
            --border:rgba(255,255,255,.07); --accent:#ef4444; --ok:#4ade80;
            --font:'Geist',system-ui,-apple-system,sans-serif; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { background:var(--bg); color:var(--fg); font-family:var(--font); min-height:100vh; -webkit-font-smoothing:antialiased; }
    .wrap { min-height:100vh; display:grid; place-items:center; padding:32px 20px; }
    .card { width:100%; max-width:440px; background:var(--bg-1); border:1px solid var(--border); border-radius:18px; padding:36px 32px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.5); }
    .logo { width:48px; height:48px; margin:0 auto 18px; filter:drop-shadow(0 0 24px rgba(239,68,68,.4)); }
    h1 { font-size:22px; font-weight:600; letter-spacing:-.02em; line-height:1.2; }
    p { color:var(--fg-muted); font-size:14.5px; line-height:1.6; margin-top:10px; }
    .email { color:var(--fg); font-weight:500; }
    .status { display:inline-flex; align-items:center; gap:7px; margin:18px 0 4px; padding:6px 14px; border-radius:999px; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
    .status.ok { background:rgba(74,222,128,.10); border:1px solid rgba(74,222,128,.30); color:var(--ok); }
    .status.err { background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.30); color:var(--accent); }
    .home { display:inline-block; margin-top:22px; padding:11px 22px; background:#fafafa; color:#0a0a0a; border-radius:999px; font-size:13.5px; font-weight:600; text-decoration:none; }
    .home:hover { background:#e5e5e5; }
    .foot { margin-top:24px; font-size:11px; color:var(--fg-faint); letter-spacing:.06em; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="assets/cohost-app-icon.png" alt="Cohost" />
      <div class="status" id="status">Working…</div>
      <h1 id="title">Unsubscribing you…</h1>
      <p id="message">Hold on a sec.</p>
      <a class="home" href="/">Back to Cohost</a>
      <div class="foot">cohost.live</div>
    </div>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const $status  = document.getElementById('status');
      const $title   = document.getElementById('title');
      const $message = document.getElementById('message');

      const setOk  = (t,m) => { $status.className='status ok';  $status.textContent='✓ Unsubscribed'; $title.textContent=t; $message.innerHTML=m; };
      const setErr = (t,m) => { $status.className='status err'; $status.textContent='! Error';        $title.textContent=t; $message.textContent=m; };

      if (!token) { setErr("Missing token", "This unsubscribe link is incomplete. If you got this from an email, try clicking the link directly."); return; }

      try {
        const res = await fetch('/api/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();
        if (data.ok) {
          const email = data.email ? `<span class="email">${escapeHtml(data.email)}</span>` : 'You';
          if (data.alreadyUnsubscribed) {
            setOk("You were already unsubscribed", `${email} won't receive any more marketing emails from Cohost.`);
          } else {
            setOk("You're unsubscribed", `${email} won't receive any more marketing emails from Cohost. Sorry to see you go.`);
          }
        } else {
          setErr("Couldn't unsubscribe", data.error || 'Unknown error.');
        }
      } catch (err) {
        setErr("Network error", err?.message || 'Try again in a moment.');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      }
    })();
  </script>
</body>
</html>
