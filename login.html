<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sign in — Cohost</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#050505;--bg-2:#0f0f0f;--bg-3:#161616;
      --fg:#fafafa;--fg-muted:#a1a1a1;--fg-faint:#6f6f6f;
      --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.13);
      --accent:#ef4444;--accent-soft:rgba(239,68,68,.10);
      --r:8px;--r-md:12px;--r-lg:18px;
      --font:'Geist',system-ui,-apple-system,sans-serif;
      --easing:cubic-bezier(.16,1,.3,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:var(--bg);color:var(--fg);font-family:var(--font);
      min-height:100vh;display:grid;place-items:center;
      letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
      background-image:
        radial-gradient(ellipse 60% 50% at 50% 30%,rgba(239,68,68,.08) 0%,transparent 60%),
        radial-gradient(ellipse 80% 60% at 30% 100%,rgba(167,139,250,.05) 0%,transparent 60%);
      padding:24px;
    }
    .login-card{
      width:100%;max-width:400px;
      background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 100%);
      border:1px solid var(--border-2);
      border-radius:var(--r-lg);
      padding:36px 32px 32px;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
      animation:in .6s var(--easing);
    }
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .logo{
      display:flex;align-items:center;gap:10px;
      margin-bottom:28px;font-size:15px;font-weight:600;letter-spacing:-.018em;
    }
    .logo img{width:24px;height:24px;filter:drop-shadow(0 0 10px rgba(239,68,68,.3))}
    h1{font-size:22px;font-weight:600;letter-spacing:-.022em;line-height:1.15;margin-bottom:6px}
    .sub{font-size:13.5px;color:var(--fg-muted);margin-bottom:26px}
    label{display:block;font-size:11.5px;font-weight:600;color:var(--fg-faint);
      letter-spacing:.10em;text-transform:uppercase;margin-bottom:8px}
    .input{
      width:100%;background:var(--bg-3);border:1px solid var(--border-2);
      border-radius:var(--r);padding:11px 14px;font-size:14px;color:var(--fg);
      outline:none;font-family:var(--font);letter-spacing:-.005em;
      transition:border-color .18s,box-shadow .18s;
    }
    .input:focus{border-color:rgba(255,255,255,.22);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:7px;
      width:100%;padding:11px;background:var(--fg);color:var(--bg);
      border-radius:var(--r);font-size:14px;font-weight:600;letter-spacing:-.005em;
      cursor:pointer;border:none;margin-top:18px;
      transition:transform .2s var(--easing),opacity .2s;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.6;cursor:wait;transform:none}
    .err{
      margin-top:14px;padding:10px 14px;font-size:13px;color:#fca5a5;
      background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);
      border-radius:var(--r);display:none;
    }
    .err.is-on{display:block}
    .back{
      display:inline-flex;align-items:center;gap:6px;
      margin-top:24px;padding-top:20px;border-top:1px solid var(--border);
      font-size:12.5px;color:var(--fg-faint);text-decoration:none;
      transition:color .18s;
    }
    .back:hover{color:var(--fg-muted)}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">
      <img src="assets/cohost-app-icon.png" alt="" />
      <span>Cohost</span>
    </div>
    <h1>Admin sign in</h1>
    <p class="sub">Authorized accounts only.</p>

    <form id="loginForm" autocomplete="on" novalidate>
      <label for="password">Password</label>
      <input class="input" type="password" id="password" name="password" autocomplete="current-password" required autofocus />
      <button class="btn" type="submit">
        <span class="btn-label">Sign in</span>
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7.5 3.5L11 7l-3.5 3.5"/></svg>
      </button>
      <div class="err" id="err"></div>
    </form>

    <a class="back" href="/">
      <svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7H3M6.5 3.5L3 7l3.5 3.5"/></svg>
      Back to site
    </a>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    const btn = form.querySelector('button');
    const label = btn.querySelector('.btn-label');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('is-on');
      const password = document.getElementById('password').value;
      btn.disabled = true;
      label.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'invalid password');
        const next = new URLSearchParams(location.search).get('next') || '/admin';
        location.href = next;
      } catch (e2) {
        err.textContent = e2.message || 'Sign in failed';
        err.classList.add('is-on');
        btn.disabled = false;
        label.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
